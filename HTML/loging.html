<link rel="stylesheet" href="../CSS/loging.css">
<link rel="icon" href="../IMG/Diseño sin título.png">
<title>Silver University</title>
<div class="mobile-screen">
    <div class="header">
      <h1>Silver University</h1>
    </div>
    
    <div class="logo">
        <img src="../IMG/Diseño sin título.png" alt="Imagen" class="login-image">
    </div>
    
    <form id="registration-form">
      <input type="email" name="email" placeholder="E-mail">
      <input type="password" name="pass" placeholder="Password">
      <input type="password" name="repass" placeholder="Repeat password">
      <a href="#" class="login-btn" id="signup-btn">Sign Up</a>
    </form>
  
    <form id="login-form">
      <input type="email" name="email" placeholder="E-mail">
      <input type="password" name="pass" placeholder="Password">
      <a href="../HTML/index.html" class="login-btn">Log in</a>
    </form>
    
    <form id="fpass-form">
      <input type="text" name="forgotten" placeholder="E-mail or phone number">
      <a href="#" class="login-btn" id="getpass-btn">Get Password</a>
    </form>
    
    <div class="other-options">
      <div class="option" id="newUser"><p class="option-text">Nuevo usuario</p></div>
      <div class="option" id="fPass"><p class="option-text"> olvidaste tu contraseña</p></div>
    </div>
    
  </div>
